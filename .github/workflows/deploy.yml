name: Deploy to Server

# dots.eagombar.uk serves a single file, install.sh ("curl -sL dots.eagombar.uk | bash").
# install.sh clones everything else it needs from GitHub, so only that one file is
# uploaded: the rest of the repo, including .git, never goes on the web server.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # nginx serves the new file straight away; no reload needed.
      - name: Deploy install.sh
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            install.sh ${{ secrets.SERVER_USER }}@eagombar.uk:/var/www/dots.eagombar.uk/
