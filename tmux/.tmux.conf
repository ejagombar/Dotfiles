bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# install tpm: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Press prefix + I (capital i, as in Install) to fetch the plugin
# Press prefix + alt + u (lowercase u as in uninstall) to remove the plugin.
# prefix + U updates plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'aserowy/tmux.nvim'

set -g @tmux-nvim-navigation-cycle false 
set -g @tmux-nvim-resize-step-x 5
set -g @tmux-nvim-resize-step-y 5
set -g extended-keys on
set -g extended-keys-format csi-u

set -g @resurrect-capture-pane-contents 'on'

setw -g mouse on
set -s escape-time 0
set -g focus-events on
setw -g mode-keys vi
set -s escape-time 0
set -s set-clipboard on 

set -g extended-keys on
set -g extended-keys-format csi-u

set-option -g history-limit 10000

set-option -sa terminal-overrides ",xterm*:Tc"

# use vim-like keys for splits and windows
bind-key v split-window -h -c '#{pane_current_path}'
bind-key s split-window -v -c '#{pane_current_path}'
bind-key w choose-tree -Zs

# $ in the session picker renames the session under the cursor. Tree mode keys
# can't be rebound, so mark the item (m), read its session back via {marked},
# then prompt. Outside the picker $ is passed through as normal.
bind-key -n '$' if-shell -F '#{==:#{pane_mode},tree-mode}' {
    send-keys m
    run-shell -C -t '{marked}' "select-pane -M ; command-prompt -I '#S' { rename-session -t '#{session_id}' -- '%%' }"
} {
    send-keys '$'
}

# Prompt templates replace every %1 but only the first %%
# New session named at a prompt, started in the current directory
bind-key S command-prompt -p 'new session:' {
    if-shell -F '#{!=:%1,}' { new-session -A -s '%1' -c '#{pane_current_path}' }
}

# Move the current window to a session named at a prompt, creating it if needed
# (replacing its starting window). Sessions are targeted by id as names can
# contain : and .
bind-key B command-prompt -p 'move window to session:' {
    if-shell -F '#{!=:%1,}' {
        set-option -gF @dest '#{S:#{?#{==:#{session_name},%1},#{session_id},}}'
        if-shell -F '#{@dest}' {
            run-shell -C "switch-client -t '#{@dest}' ; move-window -s '#{window_id}' -t '#{@dest}:'"
        } {
            new-session -d -s '%1' -c '#{pane_current_path}'
            set-option -gF @dest '#{S:#{?#{==:#{session_name},%1},#{session_id},}}'
            run-shell -C "switch-client -t '#{@dest}' ; move-window -s '#{window_id}' -t '#{@dest}:' ; kill-window -t '#{@dest}:^' ; move-window -r -t '#{@dest}:'"
        }
    }
}

# Switch between hozontal and vertical layout
bind-key + select-layout main-horizontal
bind-key = select-layout main-vertical

# Shift + Alt + H/L to go back/forward between windows
bind -n M-H previous-window
bind -n M-L next-window

# Click or Ctrl+click a link to open it, whether an OSC 8 hyperlink or a URL in
# the text, even one wrapped onto the next line (see ~/bin/open-url). Programs
# that use the mouse (nvim, lazygit) still get plain clicks, but not Ctrl+click,
# which Claude Code would open a second time. mouse_word only spans a whole URL
# when space is the sole word separator, so that's swapped in while the click
# is read. Before 3.6, tmux read the link from the live screen even when
# scrolled back in copy mode, so clicks there are ignored rather than opening
# the wrong link. If open-url fails or isn't installed yet, a hint goes to the
# status line, as tmux would otherwise fill the pane with the error.
bind-key -n MouseUp1Pane {
    send-keys -M
    if-shell -F '#{?pane_in_mode,#{>=:#{version},3.6},1}' {
        set-option -gF @saved-word-separators '#{word-separators}'
        set-option -g word-separators ' '
        run-shell -b '~/bin/open-url #{q:mouse_hyperlink} #{q:mouse_word} || tmux display-message "~/bin/open-url failed, rerun install.sh if it is missing"'
        set-option -gF word-separators '#{@saved-word-separators}'
    }
}
# Ctrl+click focuses the pane rather than swapping it with the active one
bind-key -n C-MouseDown1Pane select-pane -t =
bind-key -n C-MouseUp1Pane if-shell -F '#{?pane_in_mode,#{>=:#{version},3.6},1}' {
    set-option -gF @saved-word-separators '#{word-separators}'
    set-option -g word-separators ' '
    run-shell -b '~/bin/open-url #{q:mouse_hyperlink} #{q:mouse_word} || tmux display-message "~/bin/open-url failed, rerun install.sh if it is missing"'
    set-option -gF word-separators '#{@saved-word-separators}'
}

bind G new-window -n 'lazygit' lazygit
bind-key f run-shell "tmux display-popup -E ~/bin/tmux-sessioniser"

# With xclip
# bind-key -n C-y run "tmux show-buffer | xclip -selection clipboard -i >/dev/null"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel -ib" \; display-message "Copied to clipboard"
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "xsel -ib" \; display-message "Copied to clipboard"

bind g display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit"
bind n display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "nvim ~/notes.md"
# Color Scheme --------------------------------------------------

# Status Bar Options
set -g status on
set -g status-justify left

set -g status-left-length 100
set -g status-right-length 100

# Messages
set -g message-style "fg=#aab2bf,bg=#1e2127"
set -g message-command-style "fg=#aab2bf,bg=#1e2127"

# Status Appearance

# Window Status
setw -g window-status-style "fg=#1e2127,bg=#282c34"
setw -g window-status-activity-style "fg=#1e2127,bg=#282c34"
setw -g window-status-separator ""

setw -g window-style "fg=#5c6370"
setw -g window-active-style "fg=#aab2bf"

# Pane Borders
set -g pane-border-style "fg=#aab2bf,bg=#1e2127"
set -g pane-active-border-style "fg=#98c379,bg=#1e2127"

# Display Panes
set -g display-panes-active-colour "#e5c07b"
set -g display-panes-colour "#61afef"

# Status Bar Colors
set -g status-style "fg=#aab2bf,bg=#1e2127"

# Prefix Highlight
set -g @prefix_highlight_fg "#1e2127"
set -g @prefix_highlight_bg "#98c379"
set -g @prefix_highlight_copy_mode_attr "fg=#1e2127,bg=#98c379"
set -g @prefix_highlight_output_prefix " | "

set -g status-right "#[fg=#aab2bf,bg=#1e2127,nounderscore,noitalics]%H:%M | %d/%m/%Y #[fg=#98c379,bg=#3e4452,nobold,nounderscore,noitalics]#[fg=#282c34,bg=#98c379,bold] #h #[fg=#e5c07b, bg=#98c379]#[fg=#e06c75,bg=#e5c07b]"

set -g status-left "#[fg=#1e2127,bg=#98c379,bold] #S #{prefix_highlight}#[fg=#98c379,bg=#282c34,nobold,nounderscore,noitalics]"

setw -g window-status-format "#[fg=#1e2127,bg=#282c34,nobold,nounderscore,noitalics]#[fg=#aab2bf,bg=#282c34] #I | #W #[fg=#282c34,bg=#282c34,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#1e2127,bg=#3e4452,nobold,nounderscore,noitalics]#[fg=#aab2bf,bg=#3e4452,nobold] #I | #W #[fg=#3e4452,bg=#282c34,nobold,nounderscore,noitalics]"

# ------------------------------------------------------------------

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
